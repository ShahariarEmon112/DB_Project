<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | ArenaX</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <a class="d-flex align-items-center gap-3 mb-4" href="index.html">
        <span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span>
        <span class="h4 fw-bold mb-0">ArenaX</span>
      </a>
      <h1 class="h2 fw-bold mb-2">Welcome Back</h1>
      <p class="text-muted-soft mb-4">Sign in to manage tournaments and team performance.</p>
      <form>
        <div class="mb-3">
          <label class="form-label text-muted-soft">Email</label>
          <input type="email" class="form-control" placeholder="captain@arenax.gg">
        </div>
        <div class="mb-4">
          <label class="form-label text-muted-soft">Password</label>
          <input type="password" class="form-control" placeholder="••••••••">
        </div>
        <a href="dashboard.html" class="btn btn-neon w-100 py-3">Login</a>
      </form>
      <div class="d-flex justify-content-between mt-4 small">
        <a class="text-muted-soft" href="index.html">Back home</a>
        <a class="text-info" href="#">Forgot password?</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
